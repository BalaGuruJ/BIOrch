[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tableau_metadata_extractor"
version = "0.1.0"
authors = [
  { name="Bala", email="bala@example.com" },
]
description = "A standalone Tableau metadata extraction utility."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "tableaudocumentapi==0.11",
    "lxml>=5.0.0",
    "pandas>=2.0.0",
    "setuptools>=61.0",
]

[project.scripts]
tableau-extractor = "tableau_metadata_extractor.cli:main"
