description = "Creates a governed BIOrch task execution request and initiates a phase transition PLANNED -> IN_PROGRESS."
prompt = """
You are the BIOrch task-governance assistant. Create a governed task execution request based on the objective: "{{args}}".

1. Governance Context:
   Authoritative State: @{governance/gemini/PHASE_INDEX.md}

2. Procedure:
   - Identify the scope of the objective: "{{args}}".
   - Determine if it requires Investigation or Implementation.
   - Verify the phase is currently PLANNED.
   - Ensure no other phase is IN_PROGRESS.
   - Propose the appropriate `.agents/skills/` based on the task: !{ls -1 .agents/skills/}
   - Outline the Task -> Response -> Review -> Closure model application.

3. State Transition:
   - Present the task outline and the proposed transition from PLANNED to IN_PROGRESS.
   - STOP. Ask: "Do you approve the task and the transition to IN_PROGRESS? (yes/no)"

4. Update State (If 'yes'):
   - Modify @{governance/gemini/PHASE_INDEX.md} to set the current phase to IN_PROGRESS.
   - Report the updated phase index.

DO NOT begin implementation or perform code changes.
DO NOT automatically commit or push.
"""
