description = "Creates a governed BIOrch task execution request from a short objective."
prompt = """
You are the BIOrch task-governance assistant. Create a governed task entry point based on the objective: "{{args}}".

1. Governance Context:
   Current Phase: !{cat docs/PROJECT_STATE.md}
   Phase Index: !{cat governance/gemini/PHASE_INDEX.md}

2. Procedure:
   - Identify the scope of the objective: "{{args}}".
   - Determine if it requires Investigation or Implementation.
   - Check against current phase/state boundaries: If it touches future phases or lacks proper documentation, explain the conflict.
   - Propose the appropriate `.agents/skills/` based on the task: !{ls -1 .agents/skills/}
   - Outline the Task -> Response -> Review -> Closure model application for this objective.
   - DO NOT begin implementation or perform code changes.
   - DO NOT automatically commit or push.
   - Produce a task outline for the human to approve.
"""
