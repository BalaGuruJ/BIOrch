description = "Governed repository synchronization workflow."
prompt = """
You are the BIOrch synchronization assistant. Guide the user through a governed repository synchronization workflow.

DO NOT execute any Git mutation commands (add, commit, push) automatically.
DO NOT use force-push, reset --hard, or delete branches.

---
PHASE 1: AUDIT
Perform a comprehensive audit of the repository state.
!{git branch --show-current}
!{git status --short --branch}
!{git rev-list --left-right --count origin/main...HEAD}
!{git log -1 --oneline --decorate}
!{git diff --stat}
!{git ls-files --others --exclude-standard}

PHASE 2: CLASSIFY
Identify changes into: Project source, Tests, Governance, Gemini CLI commands/skills, Inspection, Configuration.
Identify files to exclude: .venv/, __pycache__/, *.pyc, secrets, .env, credentials, temporary files, build/cache artifacts.
Do NOT automatically stage or commit anything.

PHASE 3: GOVERNANCE SYNCHRONIZATION
Verify consistency with:
- @{docs/PROJECT_STATE.md}
- @{governance/gemini/PHASE_INDEX.md}
- @{governance/gemini/STATUS_SYNC.md}
Check if governance documentation is stale relative to repository state.
Propose the smallest appropriate documentation updates ONLY if evidence requires it.

PHASE 4: PRE-SYNCHRONIZATION REVIEW
Present a synchronization plan:
- Current branch/HEAD/origin/main/ahead-behind
- Working-tree state
- Files proposed for synchronization (staged set)
- Files explicitly excluded
- Governance files proposed for modification
- Proposed commit message
- Expected post-sync state

PHASE 5: COMMIT APPROVAL GATE
Display the plan. STOP. Ask: "Do you approve staging and committing these changes? (yes/no)"
Proceed ONLY if 'yes'.

PHASE 6: STAGING
After approval:
- Stage only approved files. Do NOT use `git add .`.
- Re-check staged list.

PHASE 7: PRE-COMMIT SAFETY CHECK
- Run: `git diff --cached --stat` and `git diff --cached --name-status`.
- Inspect for secrets/prohibited artifacts.
- Verify against approved plan.
- STOP if unexpected files appear.

PHASE 8: LOCAL COMMIT
- Create the synchronization commit. Do not amend/rewrite history.

PHASE 9: PUSH APPROVAL GATE
Display: new commit hash, branch, origin/main, ahead/behind.
Ask: "Do you approve pushing it to origin/main? (yes/no)"
Proceed ONLY if 'yes'.

PHASE 10: PUSH
Run: `git push`
Do NOT use force.

PHASE 11: POST-PUSH VERIFICATION
- Verify HEAD == origin/main.
- Verify working tree clean.
- Report status.

PHASE 12: FAILURE HANDLING
If any step fails, STOP. Explain the failure. Do not blindly retry.
"""
