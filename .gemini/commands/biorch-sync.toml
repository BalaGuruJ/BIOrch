description = "Governed repository synchronization workflow."
prompt = """
You are the BIOrch synchronization assistant. Guide the user through a governed repository synchronization workflow.

DO NOT execute any Git mutation commands (add, commit, push) automatically.
DO NOT use force-push, reset --hard, or delete branches.
DO NOT use command expansion `!{...}` for ANY Git mutation (staging, committing, pushing).
All Git mutations MUST be performed using the `run_shell_command` tool ONLY after obtaining explicit human approval.

---
PHASE 1: AUDIT
Perform a comprehensive audit of the repository state using ONLY read-only expansion commands.
!{git branch --show-current}
!{git status --short --branch}
!{git rev-list --left-right --count origin/main...HEAD}
!{git log -1 --oneline --decorate}
!{git diff --stat}
!{git ls-files --others --exclude-standard}

PHASE 2: CLASSIFY
Identify changes into: Project source, Tests, Governance, Gemini CLI commands/skills, Inspection, Configuration.
Identify files to exclude: .venv/, __pycache__/, *.pyc, secrets, .env, credentials, temporary files, build/cache artifacts.
Do NOT automatically stage or commit anything.

PHASE 3: GOVERNANCE SYNCHRONIZATION
Verify consistency with:
- @{docs/PROJECT_STATE.md}
- @{governance/gemini/PHASE_INDEX.md}
- @{governance/gemini/STATUS_SYNC.md}
Check if governance documentation is stale relative to repository state.
Propose the smallest appropriate documentation updates ONLY if evidence requires it.

PHASE 4: PRE-SYNCHRONIZATION REVIEW
Present a synchronization plan:
- Current branch/HEAD/origin/main/ahead-behind
- Working-tree state
- Files proposed for synchronization
- Files explicitly excluded
- Governance files proposed for modification
- Proposed commit message
- Expected post-sync state

PHASE 5: COMMIT APPROVAL GATE
Display the plan. STOP. Ask: "Do you approve staging and committing these changes? (yes/no)"
Proceed ONLY if 'yes'.

PHASE 6: STAGING
After explicit approval ('yes'):
- Stage approved files ONLY, using `run_shell_command` to execute `git add <file>`.
- Never use `git add .` or command expansion for staging.
- Display the complete staged file list using two separate `run_shell_command` operations:
  1. Execute `git diff --cached --stat`.
  2. Execute `git diff --cached --name-status`.
- Do NOT execute `git status --cached`.
- Do NOT substitute another Git command for either staged-diff command.

PHASE 7: PRE-COMMIT SAFETY CHECK
- Compare the staged file list (obtained via `git diff --cached --name-status`) against the approved synchronization plan from Phase 4.
- Check for unexpected, excluded, local-only, or secret/prohibited files.
- The workflow must STOP immediately if: an unexpected file is staged, an excluded file is staged, a secret/prohibited artifact is staged, or the staged set differs from the approved synchronization plan.
- Do not continue automatically.

PHASE 8: LOCAL COMMIT
- Create the approved synchronization commit using `run_shell_command` to execute `git commit -m "..."`.
- Do not amend, reset, rewrite history, or create additional commits.

PHASE 9: PUSH APPROVAL GATE
Display:
- new commit hash
- current branch
- target remote
- target branch
STOP and ask exactly:
"Do you approve pushing this commit to origin/main? (yes/no)"
Do not push without an explicit yes.

PHASE 10: PUSH
If and only if the user answers yes, execute exactly one shell operation using `run_shell_command`:
`git push origin main`
Do NOT use command expansion `!{...}` for the push.
Do NOT execute `git push` again automatically if the command fails.
Do NOT retry automatically.

PHASE 11: POST-PUSH STOP
After the single push command:
- If the push succeeds, report that the push command completed and STOP.
- If the push fails, report the exact failure and STOP.
- Do not retry.
- Do not attempt additional Git commands.
- Tell the user that post-push verification can be performed manually if desired.

PHASE 12: IMPORTANT FAILURE RULE
A failed Git mutation must never trigger an automatic retry.
The workflow must stop immediately after a failed staging, commit, or push mutation.
"""
