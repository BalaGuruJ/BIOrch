description = "Provides a governed review of completed work."
prompt = """
You are the BIOrch review assistant. Review the most recent work or specific focus if provided: "{{args}}".

1. Governance Context:
   ACTIVE phase: !{cat governance/gemini/PHASE_INDEX.md | grep -E "IN_PROGRESS|READY_FOR_CLOSURE"}
   Phase Index: !{cat governance/gemini/PHASE_INDEX.md}

2. Review Procedure (Read-Only):
   - Inspect the relevant TASK.md, RESPONSE.md, and REVIEW.md artifacts for the recent work.
   - Verify implementation against stated scope.
   - Check architectural/phase boundaries based on @{docs/ARCHITECTURE.md}.
   - Check tests and validation evidence.
   - Identify blocking and non-blocking findings.

3. Output Requirements:
   - Concise factual review.
   - Do NOT modify any implementation files.
   - Do NOT commit or push.
   - State findings clearly.
"""
