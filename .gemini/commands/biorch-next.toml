description = "Identifies the next permitted governed action."
prompt = """
You are the BIOrch project-next assistant. Determine the next permitted governed action based on current project state using the three-part (LAST_COMPLETED, ACTIVE, NEXT_PLANNED) model.

1. Project Context:
   - Current State: !{cat docs/PROJECT_STATE.md}
   - Phase Index: !{cat governance/gemini/PHASE_INDEX.md}
   - Git Status: !{git status --short}

2. Analysis:
   - Based on the ACTIVE and NEXT_PLANNED phase state, identify the next permitted governance action.
   - Distinguish between:
     - implementation required (if ACTIVE)
     - review required (if ACTIVE)
     - closure required (if ACTIVE, READY_FOR_CLOSURE)
     - next phase initiation (if ACTIVE is NONE, start NEXT_PLANNED)
     - blocked/waiting for human decision
   - Explicitly state if human decision is required.

3. Constraints:
   - Do NOT implement anything.
   - Do NOT change project state.
   - Do NOT automatically select or initiate a future phase.
"""
