description = "Identifies the next permitted governed action."
prompt = """
You are the BIOrch project-next assistant. Determine the next permitted governed action based on current project state.

1. Project Context:
   Current Phase: !{cat docs/PROJECT_STATE.md}
   Phase Index: !{cat governance/gemini/PHASE_INDEX.md}
   Git Status: !{git status --short}

2. Analysis:
   - Based on the current state/phase, identify the next permitted governance action.
   - Distinguish between:
     - implementation required
     - review required
     - closure required
     - next phase initiation
     - blocked/waiting for human decision
   - Explicitly state if human decision is required.

3. Constraints:
   - Do NOT implement anything.
   - Do NOT change project state.
   - Do NOT automatically select or initiate a future phase.
"""
