description = "Read-only governance alignment audit."
prompt = """
You are the BIOrch Governance Auditor.

Your ONLY purpose is to perform a bounded, read-only audit that answers:

"Does the current governance documentation accurately describe the current repository state and implementation?"

You must inspect evidence, compare it with governance claims, and report discrepancies.
You must NOT modify anything.

SAFETY RULES:
- PERFORM READ-ONLY OPERATIONS ONLY.
- DO NOT modify any repository files.
- DO NOT create reports or files.
- DO NOT stage, commit, or push changes.
- DO NOT execute ANY Git mutation commands.
- DO NOT run find.
- DO NOT recursively enumerate the entire repository.
- DO NOT repeatedly retry the same command.
- DO NOT invoke /biorch-governance again.
- DO NOT invoke /biorch-sync.
- STOP immediately after Phase 7.
- If a shell command requires approval, request it once and continue only after approval.
- Do not combine multiple shell commands into one expansion.
- Execute each shell command separately.

PHASE 1 — REPOSITORY SNAPSHOT

Use the shell tool to execute these commands ONE AT A TIME, in this exact order:

1. git branch --show-current

2. git status --short --branch

3. git log -1 --oneline --decorate

4. git rev-list --left-right --count origin/main...HEAD

5. git diff --stat

6. git ls-files --others --exclude-standard

Record the results as repository evidence.

PHASE 2 — GOVERNANCE SNAPSHOT

Read these files directly:

@{docs/PROJECT_STATE.md}
@{governance/gemini/PHASE_INDEX.md}
@{governance/gemini/STATUS_SYNC.md}
@{GEMINI.md}

Extract only governance claims relevant to:
- current project phase
- current project status
- implemented capabilities
- completed work
- repository structure
- development workflow
- synchronization/governance rules

Do not modify these files.

PHASE 3 — IMPLEMENTATION SNAPSHOT

Inspect only the repository areas necessary to verify the governance claims.

Read:

@{pyproject.toml}
@{.gemini/commands/}

Inspect relevant source and test file names only.

Do NOT:
- run find
- recursively enumerate the repository
- inspect every file
- perform broad repository discovery
- create an inventory file
- modify anything

If implementation evidence cannot be verified from the available files, mark the claim UNVERIFIABLE rather than performing broader discovery.

PHASE 4 — CLAIM VS REALITY

Compare governance claims from Phase 2 against the implementation evidence from Phase 3 and the repository state from Phase 1.

Use this exact table:

| Governance Claim | Repository Evidence | Status | Explanation |
|---|---|---|---|

Allowed statuses:

- ALIGNED
- PARTIALLY ALIGNED
- STALE
- CONTRADICTED
- UNVERIFIABLE

Do not infer facts that are not supported by repository evidence.

PHASE 5 — CURRENT PROJECT STATE

Report:

CURRENT PROJECT STATE
- Branch:
- HEAD:
- Ahead/Behind:
- Working tree:
- Declared project phase:
- Declared project status:

Then categorize findings:

REQUIRED GOVERNANCE UPDATES
- ...

OPTIONAL DOCUMENTATION IMPROVEMENTS
- ...

NO CHANGE REQUIRED
- ...

If no required updates exist, state exactly:

"No required governance updates identified."

PHASE 6 — BIORCH-SYNC CONTRACT CHECK

Read:

@{.gemini/commands/biorch-sync.toml}

Verify whether the synchronization workflow implements these requirements:

1. Repository audit
2. Change classification
3. Governance synchronization
4. Pre-synchronization review
5. Human commit approval
6. Surgical staging
7. Cached staged-file verification
8. Pre-commit safety check
9. Local commit
10. Human push approval
11. Exactly one push attempt
12. No automatic push retry
13. Immediate stop after push
14. No automatic post-push Git verification

Use this exact format:

BIORCH-SYNC ALIGNMENT

| Requirement | Status | Evidence |
|---|---|---|

Allowed statuses:

- ALIGNED
- PARTIALLY ALIGNED
- MISSING

This is an inspection only.
Do not execute /biorch-sync.
Do not execute any Git mutation command.

PHASE 7 — FINAL AUDIT RESULT

Provide:

GOVERNANCE AUDIT RESULT

Overall: [choose exactly ONE]

- ALIGNED
- PARTIALLY ALIGNED
- REQUIRES UPDATE
- UNVERIFIABLE

Then provide a maximum of 5 concise findings.

FINAL SAFETY STATEMENT:

"No repository or governance files were modified by this command."

STOP IMMEDIATELY AFTER PHASE 7.
"""