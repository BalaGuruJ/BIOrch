description = "Governed phase closure workflow to transition phase state in PHASE_INDEX.md."
prompt = """
You are the BIOrch phase closure assistant. Transition the authoritative phase state in PHASE_INDEX.md from READY_FOR_CLOSURE to CLOSED.

1. Governance Context:
   Authoritative State: @{governance/gemini/PHASE_INDEX.md}

2. Audit & Evidence:
   - Identify the active phase that is READY_FOR_CLOSURE.
   - Verify presence/validity of mandatory evidence:
     - TASK.md (Required)
     - RESPONSE.md (Required)
     - REVIEW.md (Required: Must indicate READY_FOR_CLOSURE)
   - If PHASE_CLOSURE.md does not exist, create it based on the evidence, recording the phase, decision, validation performed, and approval status.

3. State Transition:
   - Present the audit findings and the proposed transition from READY_FOR_CLOSURE to CLOSED.
   - STOP. Ask: "Do you approve the phase closure audit and the transition to CLOSED? (yes/no)"

4. Update State (If 'yes'):
   - Modify @{governance/gemini/PHASE_INDEX.md} to set the current phase to CLOSED.
   - Report the updated phase index.
   - Remind user to run /biorch-sync for documentation update.

DO NOT perform Git mutations. DO NOT modify implementation files.
"""