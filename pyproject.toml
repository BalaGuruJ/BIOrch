[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biorch"
version = "0.1.0"
description = "Agent orchestration platform for BI and repository analysis"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "pythonnet==3.2.0", "clr_loader==0.3.1", "cffi==2.1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
